[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uf90"
dynamic = ["version"]
description = "Mathematical Unicode notation for portable Fortran and fpm workflows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Nathanael Nardoto Batista"}]
keywords = ["fortran", "fpm", "unicode", "preprocessor", "scientific-computing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Pre-processors",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nnardoto/uf90"
Repository = "https://github.com/nnardoto/uf90.git"
Issues = "https://github.com/nnardoto/uf90/issues"
Changelog = "https://github.com/nnardoto/uf90/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
uf90 = "uf90.cli:main"

# Optional aliases (compatibility)
uf90-sync = "uf90.cli:main_sync_compat"
uf90-translate = "uf90.cli:main_translate_compat"
fpm-unicode = "uf90.cli:main_fpm_compat"
fpm-uf90 = "uf90.cli:main_fpm_plugin"

[tool.setuptools.dynamic]
version = {attr = "uf90.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
