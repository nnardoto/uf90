name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Run tests
        run: python -m pytest

  package:
    name: Build and verify distributions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install packaging tools
        run: python -m pip install --upgrade build pipx twine

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Smoke-test wheel through pipx
        run: |
          PIPX_BIN_DIR="$RUNNER_TEMP/pipx-bin" pipx install dist/*.whl
          "$RUNNER_TEMP/pipx-bin/uf90" --version
          "$RUNNER_TEMP/pipx-bin/fpm-uf90" --version

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  fortls:
    name: fortls compatibility
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and fortls
        run: python -m pip install . fortls==3.2.2

      - name: Generate sources and fortls configuration
        run: |
          uf90 sync examples/06_oscillator
          uf90 fortls-config examples/06_oscillator

      - name: Verify navigation stays on Unicode sources
        working-directory: examples/06_oscillator
        run: |
          fortls \
            --disable_autoupdate \
            --config .uf90-fortls.json \
            --debug_rootpath . \
            --debug_definition \
            --debug_filepath app/main.f90u \
            --debug_line 6 \
            --debug_char 8 \
            --debug_full_result > fortls-result.txt
          grep -q "src/oscillator.f90u" fortls-result.txt
